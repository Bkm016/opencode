name: backend-linux

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: build linux backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build
        run: bun ./script/build.ts --single --baseline --skip-embed-web-ui
        working-directory: packages/opencode
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Smoke test
        working-directory: packages/opencode
        run: |
          set -u
          BIN="./dist/opencode-linux-x64-baseline/bin/opencode"
          PORT=41417
          LOG_FILE="$(mktemp -t opencode-smoke-XXXXXX.log)"

          echo "Starting $BIN serve on 127.0.0.1:$PORT ..."
          "$BIN" serve --hostname 127.0.0.1 --port "$PORT" >"$LOG_FILE" 2>&1 &
          SERVE_PID=$!
          echo "serve pid=$SERVE_PID"

          cleanup() {
            if kill -0 "$SERVE_PID" 2>/dev/null; then
              kill "$SERVE_PID" 2>/dev/null || true
              wait "$SERVE_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          ok=0
          for i in $(seq 1 30); do
            if ! kill -0 "$SERVE_PID" 2>/dev/null; then
              echo "serve process exited unexpectedly"
              break
            fi
            if curl -fsS "http://127.0.0.1:$PORT/global/health" >/dev/null 2>&1; then
              echo "/global/health responded OK (attempt $i)"
              ok=1
              break
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::smoke test failed; serve logs:"
            cat "$LOG_FILE"
            exit 1
          fi

          echo "Smoke test passed."

      - name: Package
        working-directory: packages/opencode/dist/opencode-linux-x64-baseline/bin
        run: tar -czf ../../opencode-linux-x64-baseline.tar.gz opencode

      - name: Upload Linux backend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-backend-ubuntu-x64
          path: packages/opencode/dist/opencode-linux-x64-baseline.tar.gz
          if-no-files-found: error
