name: build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-linux:
    name: build Linux backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Resolve desktop version
        run: |
          VERSION=$(bun -e "console.log((await Bun.file('./packages/desktop/package.json').json()).version)")
          echo "OPENCODE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: bun ./script/build.ts --single --baseline --skip-embed-web-ui
        working-directory: packages/opencode
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Package
        run: tar -czf ../../opencode-linux-x64-baseline.tar.gz opencode
        working-directory: packages/opencode/dist/opencode-linux-x64-baseline/bin

      - name: Upload Linux backend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-backend-ubuntu-x64
          path: packages/opencode/dist/opencode-linux-x64-baseline.tar.gz
          if-no-files-found: error

  desktop-windows:
    name: build Windows desktop
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Resolve desktop version
        run: |
          VERSION=$(bun -e "console.log((await Bun.file('./packages/desktop/package.json').json()).version)")
          echo "OPENCODE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Cache Electron binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
          RUST_TARGET: x86_64-pc-windows-msvc

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_CHANNEL: prod

      - name: Package
        run: npx electron-builder --win --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          OPENCODE_CHANNEL: prod

      - name: Upload Windows desktop exe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-desktop-windows-x64
          path: packages/desktop/dist/*.exe
          if-no-files-found: error

  desktop-macos:
    name: build macOS desktop (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            app_dir: mac-arm64
          - arch: x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            app_dir: mac
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Resolve desktop version
        run: |
          VERSION=$(bun -e "console.log((await Bun.file('./packages/desktop/package.json').json()).version)")
          echo "OPENCODE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Cache Electron binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-electron-

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: prod
          RUST_TARGET: ${{ matrix.rust_target }}

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          OPENCODE_CHANNEL: prod

      - name: Package
        run: npx electron-builder --mac dir --${{ matrix.arch }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          OPENCODE_CHANNEL: prod

      - name: Archive macOS app
        run: tar -czf opencode-desktop-macos-${{ matrix.arch }}.app.tar.gz -C dist/${{ matrix.app_dir }} OpenCode.app
        working-directory: packages/desktop

      - name: Upload macOS desktop app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-desktop-macos-${{ matrix.arch }}
          path: packages/desktop/opencode-desktop-macos-${{ matrix.arch }}.app.tar.gz
          if-no-files-found: error

  release:
    name: publish release
    if: github.event_name == 'push'
    needs:
      - backend-linux
      - desktop-windows
      - desktop-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: opencode-*
          path: release
          merge-multiple: true

      - name: Move latest release ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/latest" -f sha="${GITHUB_SHA}" -F force=true
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/latest" -f sha="${GITHUB_SHA}"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: latest
          name: Latest
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ## Download

            | Platform | File |
            |----------|------|
            | Linux x64 | `opencode-linux-x64-baseline.tar.gz` |
            | Windows x64 | `opencode-desktop-win-x64.exe` |
            | macOS Apple Silicon | `opencode-desktop-macos-arm64.app.tar.gz` |
            | macOS Intel | `opencode-desktop-macos-x64.app.tar.gz` |

            ### macOS 首次运行

            解压应用后，如果 macOS Gatekeeper 拦截未公证的应用，请执行：

            ```bash
            xattr -cr OpenCode.app
            ```
          files: release/*
          fail_on_unmatched_files: true
