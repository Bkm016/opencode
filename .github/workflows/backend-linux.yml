name: backend-linux

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: build linux backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Build
        run: bun ./script/build.ts --single --baseline --skip-embed-web-ui
        working-directory: packages/opencode
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Package
        working-directory: packages/opencode/dist/opencode-linux-x64-baseline/bin
        run: tar -czf ../../opencode-linux-x64-baseline.tar.gz opencode

      - name: Upload Linux backend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-backend-ubuntu-x64
          path: packages/opencode/dist/opencode-linux-x64-baseline.tar.gz
          if-no-files-found: error
